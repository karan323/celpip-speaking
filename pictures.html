<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELPIP Task 3 &amp; 4 — Picture Practice</title>
<style>
  :root{--paper:#fff;--field:#F2F4F7;--ink:#1B2430;--muted:#5B6673;--navy:#1F3B73;--amber:#C77D1A;--red:#B23A3A;--line:#D6DBE2;--r:6px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--field);color:var(--ink);font:16px/1.55 "Segoe UI",Roboto,Arial,sans-serif}
  .shell{max-width:820px;margin:0 auto;padding:16px}
  header{background:var(--navy);color:#fff;border-radius:var(--r);padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:17px;font-weight:600}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}
  .tests{display:flex;gap:8px;flex-wrap:wrap}
  .tests button.on{background:var(--navy);color:#fff}
  button{font:inherit;font-weight:600;padding:10px 16px;border-radius:var(--r);border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
  button.solid{background:var(--navy);color:#fff}
  button.danger{background:var(--red);border-color:var(--red);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  svg.scene{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:var(--r);background:#fff}
  .taskline{font-size:14px;color:var(--muted);margin:0 0 4px}
  .prompt{font-size:18px;font-weight:500;margin:0 0 14px}
  .timerrow{display:flex;align-items:baseline;gap:14px;border-top:1px solid var(--line);padding-top:14px}
  .phase{font-size:14px;color:var(--muted);min-width:110px}
  .clock{font-size:42px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--navy);line-height:1}
  .clock.rec{color:var(--red)}
  .bar{height:6px;background:var(--field);border-radius:3px;margin:10px 0 16px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .9s linear}
  .bar.rec i{background:var(--red)}
  .controls{display:flex;gap:10px;flex-wrap:wrap}
  label{display:block;font-size:14px;color:var(--muted);margin:16px 0 6px}
  textarea{width:100%;min-height:130px;font:inherit;font-size:15px;padding:12px;border:1px solid var(--line);border-radius:var(--r);resize:vertical}
  audio{width:100%}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0}
  .live{display:none;align-items:center;gap:8px;font-size:14px;color:var(--red);margin-top:8px}
  .live .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:b 1s infinite}
  @keyframes b{50%{opacity:.2}}
  @media (prefers-reduced-motion:reduce){.live .dot{animation:none}.bar i{transition:none}}
  details{margin-top:12px;font-size:15px}
  summary{cursor:pointer;color:var(--navy);font-weight:600}
  details ul{margin:8px 0 0 18px;padding:0}
  .stats{font-size:14px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="shell">
  <header><h1>CELPIP Task 3 &amp; 4 — Picture Practice</h1><span id="badge">Test 1</span></header>

  <div class="card">
    <div class="tests">
      <button data-t="0" class="on">Test 1 — Park</button>
      <button data-t="1">Test 2 — Bus stop</button>
      <button data-t="2">Test 3 — Kitchen</button>
    </div>
  </div>

  <div class="card">
    <div id="pic"></div>
    <p class="taskline" id="taskline"></p>
    <p class="prompt" id="prompt"></p>
    <div class="timerrow"><div class="phase" id="phase">Ready</div><div class="clock" id="clock">0:30</div></div>
    <div class="bar" id="bar"><i></i></div>
    <div class="controls">
      <button id="t3" class="solid">Start Task 3 (describe)</button>
      <button id="t4">Start Task 4 (predict)</button>
      <button id="stop" class="danger" disabled>Stop</button>
      <button id="copy">Copy for Claude</button>
    </div>
    <div class="live" id="live"><span class="dot"></span>Listening</div>

    <div id="playwrap" style="display:none"><label>Your recording</label><audio id="player" controls></audio></div>
    <label for="tr">Transcript (edit any misheard words)</label>
    <textarea id="tr" placeholder="Your speech appears here while you talk."></textarea>
    <div class="stats" id="stats"></div>
    <p class="hint" id="hint"></p>

    <details><summary>Vocabulary for this picture (open after you speak)</summary><div id="vocab"></div></details>
  </div>
</div>

const $ = id=>document.getElementById(id);

function load(){
  const s = SCENES[si];
  $("badge").textContent = `Test ${si+1}`;
  $("pic").innerHTML = s.svg;
  $("vocab").innerHTML = "<ul>"+s.vocab.map(v=>`<li>${v}</li>`).join("")+"</ul>";
  setTask(3);
  document.querySelectorAll(".tests button").forEach(b=>b.classList.toggle("on", +b.dataset.t===si));
}
function setTask(n){
  task = n; const s = SCENES[si];
  $("taskline").textContent = `Task ${n} — ${n===3?"Describing a Scene":"Making Predictions"}  |  Prep 30s  |  Speak 60s`;
  $("prompt").textContent = n===3 ? s.t3 : s.t4;
  $("phase").textContent="Ready"; $("clock").textContent="0:30"; $("clock").className="clock";
  $("bar").className="bar"; $("bar").querySelector("i").style.width="0%";
  $("tr").value=""; finalText=""; lowConf=[]; delivery=null; $("stats").textContent="";
  $("playwrap").style.display="none";
  $("stop").disabled=true;
}
document.querySelectorAll(".tests button").forEach(b=>b.onclick=()=>{ si=+b.dataset.t; stopAll(); load(); });
$("t3").onclick = ()=>{ stopAll(); setTask(3); begin(); };
$("t4").onclick = ()=>{ stopAll(); setTask(4); begin(); };
$("stop").onclick = ()=> finish();

function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function count(sec,label,cls,done){
  clearInterval(timer); let left=sec; const tot=sec;
  $("phase").textContent=label; $("clock").className="clock "+cls; $("bar").className="bar "+cls;
  $("clock").textContent=fmt(left);
  timer=setInterval(()=>{ left--; $("clock").textContent=fmt(left);
    $("bar").querySelector("i").style.width=((tot-left)/tot*100)+"%";
    if(left<=0){ clearInterval(timer); done(); } },1000);
}
function begin(){
  count(30,"Preparation — study the picture","",()=>{ beep(); speak(); });
}
function speak(){
  live=true; $("stop").disabled=false; record();
  mic();
  count(60,"Speaking","rec",()=>{ beep(); finish(); });
}
function finish(){
  clearInterval(timer); stopMic(); stopRecord();
  $("phase").textContent = task===3 ? "Finished — now try Task 4" : "Finished";
  $("clock").className="clock"; $("bar").className="bar"; $("stop").disabled=true;
  showStats();
}
function stopAll(){ clearInterval(timer); stopMic(); stopRecord(); }
function beep(){ try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25);}catch(e){} }

/* transcript */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("hint").textContent = SR ? "Speak out loud; words appear live. Allow the microphone once." : "Live transcript needs Chrome or Safari. You can still record and type your answer.";
function mic(){
  if(!SR) return;
  try{
    recog = new SR(); recog.lang="en-CA"; recog.continuous=true; recog.interimResults=true;
    recog.onresult = e=>{ let it="";
      for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i];
        if(r.isFinal){ finalText+=r[0].transcript+" "; if(typeof r[0].confidence==="number"&&r[0].confidence>0&&r[0].confidence<.75) lowConf.push(r[0].transcript.trim()); }
        else it+=r[0].transcript; }
      $("tr").value=(finalText+it).trim(); };
    recog.onend = ()=>{ if(live){ try{recog.start();}catch(e){} } };
    recog.start(); $("live").style.display="inline-flex";
  }catch(e){}
}
function stopMic(){ live=false; if(recog){ try{recog.onend=null;recog.stop();}catch(e){} recog=null; } $("live").style.display="none"; }

/* recording + delivery */
async function record(){
  delivery={pauses:0,longest:0}; speakStart=Date.now();
  try{
    if(!stream||!stream.active) stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mediaRec.onstop=()=>{ const b=new Blob(chunks,{type:mediaRec.mimeType||"audio/webm"});
      $("player").src=URL.createObjectURL(b); $("playwrap").style.display="block"; };
    mediaRec.start();
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser(); analyser.fftSize=1024;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const buf=new Uint8Array(analyser.fftSize); let sil=null;
    silTimer=setInterval(()=>{ analyser.getByteTimeDomainData(buf);
      let s=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; s+=v*v; }
      const rms=Math.sqrt(s/buf.length);
      if(rms>0.02){ if(sil){ const g=(Date.now()-sil)/1000; if(g>=1.2){ delivery.pauses++; delivery.longest=Math.max(delivery.longest,g); } sil=null; } }
      else if(!sil) sil=Date.now(); },100);
  }catch(e){ $("hint").textContent="Recording unavailable: "+e.message; }
}
function stopRecord(){
  clearInterval(silTimer);
  if(delivery&&speakStart) delivery.seconds=Math.round((Date.now()-speakStart)/1000);
  try{ if(mediaRec&&mediaRec.state!=="inactive") mediaRec.stop(); }catch(e){}
  try{ if(audioCtx) audioCtx.close(); }catch(e){}
  mediaRec=null; audioCtx=null;
}
function showStats(){
  const text=$("tr").value.trim(); if(!delivery||!delivery.seconds||!text) return;
  const w=text.split(/\s+/).filter(Boolean).length;
  const wpm=Math.round(w/(delivery.seconds/60));
  const fillers=(text.match(/\b(um+|uh+|er+|like|you know|basically|actually)\b/gi)||[]).length;
  const unclear=[...new Set(lowConf)].slice(0,6);
  $("stats").textContent = `${w} words in ${delivery.seconds}s · ${wpm} wpm (natural 120-160) · long pauses: ${delivery.pauses}${delivery.longest?` (longest ${delivery.longest.toFixed(1)}s)`:""} · fillers: ${fillers}${unclear.length?` · unclear: ${unclear.join(", ")}`:""}`;
}
$("copy").onclick = async ()=>{
  const s=SCENES[si]; const text=$("tr").value.trim();
  let out=`CELPIP Speaking Task ${task} (${task===3?"Describing a Scene":"Making Predictions"})\nPicture: ${s.name}\nPrompt: ${task===3?s.t3:s.t4}\n\nTranscript:\n${text}`;
  if($("stats").textContent) out+=`\n\nDelivery: ${$("stats").textContent}`;
  out+="\n\nPlease score this on the CLB scale with wrong -> correct -> reason corrections.";
  try{ await navigator.clipboard.writeText(out); $("copy").textContent="Copied"; }
  catch(e){ $("tr").value=out; $("copy").textContent="Copied into box"; }
  setTimeout(()=>$("copy").textContent="Copy for Claude",2000);
};
load();
</script>
</body>
</html>
